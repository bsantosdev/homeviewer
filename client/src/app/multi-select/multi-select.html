<button
  type="button"
  class="trigger mt-1 flex w-full items-center rounded border border-solid border-neutral-400 bg-white p-2 text-left text-[#1a1a1a] dark:border-neutral-600 dark:bg-[#1c1c1c] dark:text-[#f2f2f2]"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  (click)="open.set(!open())"
>
  <span class="summary min-w-0 flex-1 truncate" [class.opacity-60]="!summary()">{{
    summary() || placeholder()
  }}</span>
  <span class="ml-2 text-xs opacity-60" aria-hidden="true">{{ open() ? '▲' : '▼' }}</span>
</button>
@if (open()) {
  <div
    class="choices absolute left-0 right-0 z-10 mt-1 max-h-72 overflow-y-auto rounded border border-solid border-neutral-400 bg-white p-2 text-[#1a1a1a] shadow-lg dark:border-neutral-600 dark:bg-[#1c1c1c] dark:text-[#f2f2f2]"
    role="group"
    [attr.aria-label]="label()"
  >
    @for (row of rows(); track row.choice.value) {
      @if (row.heading) {
        <p
          class="heading m-0 mb-0.5 mt-2 text-xs font-semibold uppercase tracking-wide opacity-60 first:mt-0"
        >
          {{ row.heading }}
        </p>
      }
      <label class="choice flex items-center py-1.5">
        <input
          #box
          class="mr-2"
          type="checkbox"
          [checked]="selected().includes(row.choice.value)"
          (change)="toggle(row.choice.value, box.checked)"
        />
        {{ row.choice.label }}
      </label>
    }
  </div>
}
