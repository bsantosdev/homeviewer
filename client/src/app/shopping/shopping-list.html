<form class="flex shrink-0 items-center" (submit)="add($event, field)">
  <input
    #field
    class="entry min-w-0 flex-1 rounded-full border-0 bg-white/70 px-[2.5vh] py-[1.4vh] text-vh-2.5 text-inherit outline-none dark:bg-white/10"
    type="text"
    maxlength="80"
    autocomplete="off"
    placeholder="Add something to buy"
    aria-label="Add something to buy"
  />
  <button
    type="submit"
    class="add ml-[1.5vh] h-[6vh] w-[6vh] shrink-0 rounded-full bg-[#1a1a1a] p-[1.5vh] text-white [-webkit-tap-highlight-color:transparent] dark:bg-white dark:text-[#1a1a1a]"
    aria-label="Add"
  >
    <hugeicons-icon class="block h-full w-full" [icon]="addIcon" [strokeWidth]="2" />
  </button>
</form>
@if (error()) {
  <p class="error m-0 mt-[1vh] text-vh-2.5 text-red-500">{{ error() }}</p>
}

<ul
  class="m-0 mt-[1.5vh] min-h-0 flex-1 list-none overflow-y-auto p-0 [-webkit-overflow-scrolling:touch]"
>
  @for (item of items(); track item.id) {
    <li>
      <button
        type="button"
        role="checkbox"
        class="item flex w-full items-center py-[1.2vh] text-left text-vh-3 [-webkit-tap-highlight-color:transparent]"
        [attr.aria-checked]="item.done"
        (click)="service.toggle(item)"
      >
        @if (item.done) {
          <hugeicons-icon
            class="mr-[1.5vh] block h-[3.6vh] w-[3.6vh] shrink-0 text-[#34c759]"
            [icon]="doneIcon"
            [strokeWidth]="2"
          />
        } @else {
          <span
            class="mr-[1.5vh] box-border block h-[3.6vh] w-[3.6vh] shrink-0 p-[0.3vh]"
            aria-hidden="true"
          >
            <span
              class="box-border block h-full w-full rounded-full border-2 border-solid border-current opacity-50"
            ></span>
          </span>
        }
        <span
          class="text min-w-0 flex-1 truncate"
          [class]="item.done ? 'line-through opacity-50' : ''"
          >{{ item.text }}</span
        >
      </button>
    </li>
  } @empty {
    <li class="empty py-[1.2vh] text-vh-2.5 opacity-50">Nothing to buy.</li>
  }
</ul>

@if (hasDone()) {
  <button
    type="button"
    class="clear mt-[1vh] shrink-0 self-start rounded-full bg-neutral-500/20 px-[2vh] py-[1vh] text-[2vh] font-semibold uppercase tracking-wide [-webkit-tap-highlight-color:transparent]"
    (click)="service.clearDone()"
  >
    Clear ticked
  </button>
}
