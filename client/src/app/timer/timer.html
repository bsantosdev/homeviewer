@if (state() === 'setup') {
  <div class="flex items-center justify-center">
    <app-wheel-picker class="minutes" [max]="99" [(value)]="minutes" />
    <span class="mx-[1vw] text-wheel font-extralight">:</span>
    <app-wheel-picker class="seconds" [max]="59" [(value)]="seconds" />
  </div>
} @else {
  <div
    class="display text-countdown font-extralight tabular-nums"
    [class.animate-flash]="state() === 'done'"
  >
    {{ display() }}
  </div>
}

@switch (state()) {
  @case ('setup') {
    <div class="row">
      @for (m of presets; track m) {
        <button
          type="button"
          class="btn"
          [class.btn-selected]="duration() === m * 60"
          (click)="setPreset(m)"
        >
          {{ m }}m
        </button>
      }
    </div>
    <div class="row">
      <button type="button" class="btn btn-primary" [disabled]="!duration()" (click)="start()">
        Start
      </button>
    </div>
  }
  @case ('running') {
    <div class="row">
      <button type="button" class="btn btn-primary" (click)="pause()">Pause</button>
      <button type="button" class="btn" (click)="reset()">Reset</button>
    </div>
  }
  @case ('paused') {
    <div class="row">
      <button type="button" class="btn btn-primary" (click)="resume()">Resume</button>
      <button type="button" class="btn" (click)="reset()">Reset</button>
    </div>
  }
  @case ('done') {
    <p class="mt-[1vh] text-vh-4">Time's up!</p>
    <div class="row">
      <button type="button" class="btn btn-primary" (click)="reset()">Dismiss</button>
    </div>
  }
}
