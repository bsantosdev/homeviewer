<div class="mx-auto max-w-[480px] px-4 py-6 text-base">
  <h1 class="mb-4 text-2xl font-semibold">Dashboard settings</h1>

  @if (form(); as f) {
    <form class="flex flex-col" (ngSubmit)="save(f)">
      <label class="mb-3.5 flex flex-col">
        Title
        <input class="field" name="title" [(ngModel)]="f.title" />
      </label>
      <label class="mb-3.5 flex flex-col">
        Message
        <textarea class="field" name="message" rows="3" [(ngModel)]="f.message"></textarea>
      </label>
      <label class="mb-3.5 flex flex-col">
        Theme
        <select class="field" name="theme" [(ngModel)]="f.theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <label class="mb-3.5 flex flex-col">
        Location name
        <input class="field" name="locationName" [(ngModel)]="f.locationName" />
      </label>
      <div class="mb-3.5 flex">
        <label class="mr-3 flex flex-1 flex-col">
          Latitude
          <input class="field" name="latitude" type="number" step="any" [(ngModel)]="f.latitude" />
        </label>
        <label class="flex flex-1 flex-col">
          Longitude
          <input
            class="field"
            name="longitude"
            type="number"
            step="any"
            [(ngModel)]="f.longitude"
          />
        </label>
      </div>
      <fieldset class="mb-5">
        <legend class="mb-1">Outlook calendars</legend>
        <p class="mb-2 text-sm opacity-70">
          In Outlook on the web: Settings → Calendar → Shared calendars → Publish a calendar. Copy
          the ICS link.
        </p>
        @for (calendar of f.calendars; track $index; let i = $index) {
          <div class="calendar mb-2 flex items-end">
            <label class="mr-2 flex w-28 flex-col text-sm">
              Name
              <input
                id="calendar-name-{{ i }}"
                class="field"
                name="calendarName{{ i }}"
                [(ngModel)]="calendar.name"
              />
            </label>
            <label class="mr-2 flex flex-col text-sm">
              Colour
              <input
                id="calendar-color-{{ i }}"
                class="field h-[42px] w-12 cursor-pointer p-1"
                name="calendarColor{{ i }}"
                type="color"
                [(ngModel)]="calendar.color"
              />
            </label>
            <label class="mr-2 flex min-w-0 flex-1 flex-col text-sm">
              ICS link
              <input
                id="calendar-url-{{ i }}"
                class="field"
                name="calendarUrl{{ i }}"
                type="url"
                placeholder="https://outlook.live.com/…/calendar.ics"
                [(ngModel)]="calendar.url"
              />
            </label>
            <button
              type="button"
              class="mb-1 rounded px-2 py-2 text-sm underline"
              [attr.aria-label]="'Remove ' + (calendar.name || 'calendar')"
              (click)="removeCalendar(f, i)"
            >
              Remove
            </button>
          </div>
        }
        <button type="button" class="text-sm underline" (click)="addCalendar(f)">
          Add calendar
        </button>
      </fieldset>
      <div class="flex items-center">
        <button
          type="submit"
          class="rounded bg-neutral-800 px-4 py-2 text-white dark:bg-neutral-200 dark:text-neutral-900"
        >
          Save
        </button>
        <span class="ml-4">{{ status() }}</span>
        <a class="ml-auto text-blue-700 underline dark:text-[#5aa9ff]" routerLink="/"
          >View dashboard</a
        >
      </div>
    </form>
  } @else {
    <p>Loading…</p>
  }
</div>
